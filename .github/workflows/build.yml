name: Build QuickAdd

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./build.sh
      - name: Zip app
        run: ditto -c -k --keepParent build/QuickAdd.app QuickAdd.zip
      - uses: actions/upload-artifact@v4
        with:
          name: QuickAdd
          path: QuickAdd.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: QuickAdd build ${{ github.run_number }}
          files: QuickAdd.zip
          make_latest: true
